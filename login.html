<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول</title>

<style>

body{
font-family:Arial;
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#2c3e50,#4ca1af);
}

.box{
background:white;
padding:30px;
width:330px;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
text-align:center;
}

h2{
color:#2c3e50;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

.login-btn{
background:#3498db;
color:white;
}

.back-btn{
background:#2c3e50;
color:white;
}

a{
text-decoration:none;
}

.link{
display:block;
margin-top:10px;
color:#3498db;
}

</style>
</head>

<body>

<div class="box">

<h2>تسجيل الدخول</h2>

<input type="text" id="user" placeholder="اسم المستخدم">
<input type="password" id="pass" placeholder="كلمة السر">

<button class="login-btn" onclick="login()">دخول</button>

<a href="register.html" class="link">إنشاء حساب</a>

<a href="index.html">
<button class="back-btn">⬅ الرجوع للرئيسية</button>
</a>

</div>

<script>

function login(){

let user = localStorage.getItem("user");
let pass = localStorage.getItem("pass");

let inputUser = document.getElementById("user").value;
let inputPass = document.getElementById("pass").value;

if(inputUser === user && inputPass === pass){
window.location.href="index.html";
}else{
alert("معلومات خاطئة");
}

}

</script>

</body>
</html>
