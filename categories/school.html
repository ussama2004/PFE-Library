<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الكتب المدرسية</title>

<style>
body{
    font-family:Arial;
    margin:0;
    background:#f4f6f9;
}

header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:15px;
}

.sections{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:170px;
    object-fit:cover;
    border-radius:10px;
}

.card a{
    text-decoration:none;
    color:black;
}

button{
    margin-top:10px;
    padding:10px;
    border:none;
    background:#4ca1af;
    color:white;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
<h2>قسم الكتب المدرسية</h2>
<a href="index.html" style="color:white;">رجوع</a>
</header>

<section class="sections">

<a href="primary.html">

<h3>ابتدائي</h3>
<button>دخول</button>
</a>
</div>

<div class="card">
<a href="middle.html">
<img src="c:\Users\Omsoft Inf\Desktop\img\photo_2026-04-17_22-28-02.jpg">
<h3>متوسط</h3>
<button>دخول</button>
</a>
</div>

<div class="card">
<a href="secondary.html">
<img src="c:\Users\Omsoft Inf\Desktop\img\photo_2026-04-17_22-28-08.jpg">
<h3>ثانوي</h3>
<button>دخول</button>
</a>
</div>

</section>

</body>
</html>
