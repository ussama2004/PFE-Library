    background:#c0392b;

    text-align:center;
    padding:15px;
}

.levels{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    padding:30px;
}

.card{
    background:white;
    padding:20px;

    border-radius:12px;
    box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:170px;
    object-fit:cover;
    border-radius:10px;
}

button{
    margin-top:10px;
    padding:10px;
    border:none;
    background:#c0392b;
    color:white;
    border-radius:6px;
    cursor:pointer;
    width:100%;
}
</style>
</head>
