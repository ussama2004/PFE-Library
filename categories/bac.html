<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>البكالوريا</title>

<style>
body{
    font-family:Arial;
    margin:0;
    background:#f4f6f9;
}

header{
    background:#8e44ad;
    color:white;
    text-align:center;
    padding:15px;
}

.subjects{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:30px;
}

.card{
    background:white;
    padding:20px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:160px;
    object-fit:cover;
    border-radius:10px;
}

button{
    margin-top:10px;
    padding:10px;
    border:none;
    background:#8e44ad;
    color:white;
    border-radius:6px;
    cursor:pointer;
    width:100%;
}
</style>
</head>

<body>

<header>
<h2>قسم البكالوريا</h2>
<a href="secondary.html" style="color:white;">رجوع</a>
</header>

<section class="subjects">

<div class="card">
<img src="images/math.jpg">
<h3>رياضيات</h3>
<a href="books/bac_math.pdf" target="_blank">
<button>قراءة</button>
</a>
</div>

<div class="card">
<img src="c:\Users\Omsoft Inf\Desktop\img\photo_2026-04-21_12-04-33.jpg">
<h3>فيزياء</h3>
<a href="books/bac_physics.pdf" target="_blank">
<button>قراءة</button>
</a>
</div>

<div class="card">
<img src="images/science.jpg">
<h3>علوم طبيعية</h3>
<a href="books/bac_science.pdf" target="_blank">
<button>قراءة</button>
</a>
</div>

<div class="card">
<img src="images/arabic.jpg">
<h3>لغة عربية</h3>
<a href="books/bac_arabic.pdf" target="_blank">
<button>قراءة</button>
</a>
</div>

<div class="card">
<img src="images/french.jpg">
<h3>لغة فرنسية</h3>

<div class="card">

<button>قراءة</button>

</html>
