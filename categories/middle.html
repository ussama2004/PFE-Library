<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>متوسط</title>

<style>
body{
    font-family:Arial;
    margin:0;
    background:#f4f6f9;
}

header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:15px;
}

.classes{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:30px;
}

.card{
    background:white;
    padding:20px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:160px;
    border-radius:10px;
    object-fit:cover;
}

.card a{
    text-decoration:none;
    color:black;
}

button{
    margin-top:10px;
    padding:10px;
    border:none;
    background:#4ca1af;
    color:white;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
<h2>قسم المتوسط</h2>
<a href="school.html" style="color:white;">رجوع</a>
</header>

<section class="classes">

<div class="card">
<a href="1am.html">
<img src="images/class1.jpg">
<h3>أولى متوسط</h3>
<button>دخول</button>
</a>
</div>

<div class="card">
<a href="2am.html">
<img src="images/class2.jpg">
<h3>ثانية متوسط</h3>
<button>دخول</button>
</a>
</div>

<div class="card">
<a href="3am.html">
<img src="images/class3.jpg">
<h3>ثالثة متوسط</h3>
<button>دخول</button>
</a>
</div>

<div class="card">
<a href="4am.html">
<img src="images/class4.jpg">
<h3>رابعة متوسط</h3>
<button>دخول</button>
</a>
</div>

</section>

</body>
</html>
