<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إنشاء حساب</title>

<style>

body{
font-family:Arial;
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#2c3e50,#4ca1af);
}

.box{
background:white;
padding:30px;
width:330px;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
text-align:center;
}

h2{
color:#2c3e50;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:10px;
margin-top:8px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

.register-btn{
background:#27ae60;
color:white;
}

.back-btn{
background:#2c3e50;
color:white;
}

a{
text-decoration:none;
}

.link{
display:block;
margin-top:10px;
color:#3498db;
}

</style>
</head>

<body>

<div class="box">

<h2>إنشاء حساب</h2>

<input type="text" id="user" placeholder="اسم المستخدم">
<input type="password" id="pass" placeholder="كلمة السر">

<button class="register-btn" onclick="register()">تسجيل</button>

<a href="login.html" class="link">عندي حساب</a>

<a href="index.html">
<button class="back-btn">⬅ الرجوع للرئيسية</button>
</a>

</div>

<script>

function register(){

let user = document.getElementById("user").value;
let pass = document.getElementById("pass").value;

localStorage.setItem("user", user);
localStorage.setItem("pass", pass);

alert("تم إنشاء الحساب بنجاح");

window.location.href="login.html";

}

</script>

</body>
</html>
